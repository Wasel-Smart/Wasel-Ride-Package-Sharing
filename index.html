<!DOCTYPE html>

<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Initial locale must run before the application loads -->
    <script src="/initial-locale.js"></script>

    <!-- Theme / application -->
    <title>Wasel</title>
    <meta name="theme-color" content="#040C18" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="Wasel" />

    <!-- PWA / iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Wasel" />
    <meta name="apple-touch-fullscreen" content="yes" />

    <!-- Prevent automatic phone/email/address detection -->
    <meta
      name="format-detection"
      content="telephone=no, date=no, email=no, address=no"
    />

    <!-- App Store -->
    <meta name="apple-itunes-app" content="app-id=com.wasel.smart" />

    <!-- Open Graph / social sharing (static so crawlers that don't run JS still see it) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wasel" />
    <meta property="og:title" content="Wasel | Smart Mobility" />
    <meta
      property="og:description"
      content="Jordan's bilingual mobility network for rides, packages, and corridor-first travel across the kingdom."
    />
    <meta property="og:url" content="https://wasel14.online" />
    <meta property="og:image" content="https://wasel14.online/brand/assets/og/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_JO" />
    <meta property="og:locale:alternate" content="ar_JO" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wasel | Smart Mobility" />
    <meta
      name="twitter:description"
      content="Jordan's bilingual mobility network for rides, packages, and corridor-first travel across the kingdom."
    />
    <meta name="twitter:image" content="https://wasel14.online/brand/assets/og/og-default.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <!-- Apple touch icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- PWA manifest -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- iOS PWA startup images -->
    <link
      rel="apple-touch-startup-image"
      href="/apple-touch-icon.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/apple-touch-icon.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/apple-touch-icon.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/apple-touch-icon.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/apple-touch-icon.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    />

    <!-- Critical third-party connection hints -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      rel="preconnect"
      href="https://zexlxabdcsjefptmjhuq.supabase.co"
    />

    <link
      rel="preconnect"
      href="https://api.stripe.com"
    />

    <link
      rel="preconnect"
      href="https://maps.googleapis.com"
    />

    <link
      rel="dns-prefetch"
      href="https://sentry.io"
    />

    <link
      rel="dns-prefetch"
      href="https://js.stripe.com"
    />

    <!-- Preload Wasel brand asset -->
    <link
      rel="preload"
      as="image"
      href="/brand/assets/logos/symbols/symbol-default.svg"
      fetchpriority="high"
    />

    <!-- Minimal pre-render styling -->
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
      }

      html {
        background: #071521;
      }

      body {
        margin: 0;
        background: #071521;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        width: 100%;
      }
    </style>

  </head>

  <body>
    <div id="root"></div>

    <!-- Wasel application entry point -->
    <script
      type="module"
      src="/src/main.tsx"
    ></script>

  </body>
</html>
