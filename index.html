<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color is intentionally omitted here; PWA theme_color in manifest.webmanifest covers all browsers including the install path. -->
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Wasel" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wasel" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <meta name="supported-color-schemes" content="dark light" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-orientation" content="portrait" />
    <meta name="HandheldFriendly" content="true" />
    <meta name="MobileOptimized" content="width" />
    <meta name="apple-itunes-app" content="app-id=com.wasel.smart" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS PWA startup images (portrait). Replace with actual screenshots
         matching each device resolution for best results. -->
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />

    <!-- Fonts: load with display=swap so text is visible immediately. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />

    <title>Wasel | Shared Routes That Reduce Travel Cost</title>
    <script>
      (function setInitialLocale() {
        try {
          var stored = window.localStorage.getItem('wasel-language');
          var language = stored || navigator.language || 'en';
          if (language.toLowerCase().indexOf('ar') === 0) {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }
        } catch (_error) {}
      })();
    </script>
    <meta name="description" content="Wasel connects riders and drivers through shared routes to reduce cost. Book a ride, offer a route, or join the network across Jordan." />
    <meta name="keywords" content="Wasel, Jordan mobility, intercity rides, package delivery, Raje3, Amman, Aqaba, Irbid, trusted travel" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://wasel14.online" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wasel" />
    <meta property="og:title" content="Wasel | Shared Routes That Reduce Travel Cost" />
    <meta property="og:description" content="Wasel connects riders and drivers through shared routes to reduce cost. Book a ride, offer a route, or join the network across Jordan." />
    <meta property="og:url" content="https://wasel14.online" />
    <meta property="og:locale" content="en_JO" />
    <meta property="og:locale:alternate" content="ar_JO" />
    <meta property="og:image" content="/brand/assets/og/og-default.png" />
    <meta property="og:image:alt" content="Wasel | واصل mobility network logo" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wasel | Shared Routes That Reduce Travel Cost" />
    <meta name="twitter:description" content="Wasel connects riders and drivers through shared routes to reduce cost. Book a ride, offer a route, or join the network across Jordan." />
    <meta name="twitter:image" content="/brand/assets/social/social-dark.png" />
    <meta name="twitter:image:alt" content="Wasel | واصل mobility network logo" />

    <link rel="preconnect" href="https://maps.googleapis.com" />
    <link rel="dns-prefetch" href="https://supabase.co" />
    <link rel="preload" as="image" href="/brand/assets/logos/symbols/symbol-default.webp" imagesizes="280px" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
