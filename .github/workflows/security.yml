name: Security

# CodeQL is managed by GitHub's repository-level default setup. Do not run a
# second advanced-setup upload here; GitHub rejects duplicate SARIF uploads.

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - "codex/**"
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
