name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least privilege: CI only needs to read the repository. Individual jobs that
# need more (none today) must declare it themselves.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run type-check

  secrets-check:
    name: Secrets Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run secrets:check
      - run: npm run env:check

  edge-functions:
    name: Edge Functions (bundle + deno check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --legacy-peer-deps
      # `supabase functions deploy` uploads one directory at a time, so a
      # relative import that escapes that directory cannot be resolved at
      # runtime: Deno fails the whole module graph at link time and every route
      # answers 503 BOOT_ERROR while the function still reports ACTIVE. The
      # sync:check step proves the vendored copies match their sources, the graph
      # step proves nothing escapes or dangles, and the type check proves every
      # named import resolves and every handler is wired.
      - name: Bundles are self-contained and in sync
        run: npm run edge:sync:check
      - name: Module graph is closed
        run: npm run edge:graph
      - name: Type-check every edge function
        run: npm run edge:types

  oauth-check:
    name: OAuth Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # No .env exists in CI by design. The script skips variable-presence checks
      # when CI=true and still verifies config.toml, auth files and the OAuth
      # implementation.
      - run: npm run verify:oauth

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run test:unit -- --run --coverage
      - name: Enforce coverage thresholds
        run: |
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const t = summary.total;
            const fail = [];
            if (t.branches.pct < 20)  fail.push('branches ' + t.branches.pct + '% < 20%');
            if (t.functions.pct < 25) fail.push('functions ' + t.functions.pct + '% < 25%');
            if (t.lines.pct < 30)     fail.push('lines ' + t.lines.pct + '% < 30%');
            if (t.statements.pct < 28) fail.push('statements ' + t.statements.pct + '% < 28%');
            if (fail.length) { console.error('Coverage gate failed:', fail.join(', ')); process.exit(1); }
            console.log('Coverage gate passed');
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  mobile:
    name: Mobile Type, Lint, and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      # Prints the real coverage over every source file (collectCoverageFrom in
      # jest.config.js). Thresholds apply only with COVERAGE_ENFORCE=1.
      - run: npm run test:coverage -- --runInBand --coverageReporters=text-summary

  route-contract:
    name: Route Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # Reports frontend paths the edge function declares no route for. These
      # are silent 404s at runtime that no type or unit test can see. This is a
      # hard gate: /active-trip, /notifications* and /reviews are implemented, so
      # a new frontend call without a matching route must fail CI.
      - name: Frontend paths must exist on the backend
        run: npm run check:routes

  backend-wiring:
    name: Backend Wiring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Probes the live deployment, so it only does real work where credentials
    # exist. The `secrets` context is NOT available in a job-level `if` (using it
    # there makes GitHub reject the whole workflow file), so the check lives in a
    # step and reads the secrets through env instead.
    # Without this, a function whose service-role key is invalid still passes
    # lint, typecheck, deno check and the unit suite: /health returns 200 while
    # every route that reads the database 500s.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Verify frontend can reach the backend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EDGE_FUNCTIONS_BASE_URL: ${{ secrets.VITE_EDGE_FUNCTIONS_BASE_URL }}
          VITE_EDGE_FUNCTION_NAME: ${{ vars.VITE_EDGE_FUNCTION_NAME || 'make-server-0b1f4071' }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::notice::Skipping backend wiring probe: VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY secrets are not set."
            exit 0
          fi
          node scripts/verify-frontend-backend-wiring.mjs

  rls-static:
    name: RLS Coverage (static)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Replays the migrations and fails if any public table ends up without
      # ROW LEVEL SECURITY or without a policy. Deliberate exceptions go in
      # supabase/rls-allowlist.json, each with a written reason.
      - run: node scripts/check-rls-coverage.mjs

  rls-live:
    name: RLS Coverage (live database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Applies every migration to a real Postgres, so this also proves the
      # migrations run cleanly from scratch.
      - run: supabase start
      - name: Tables, views, functions and policies are safe
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          ALLOW="$(jq -r 'keys|join(",")' supabase/rls-allowlist.json)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v allow="$ALLOW" -f supabase/tests/rls_coverage.sql
      # Replay protection for Stripe webhooks: claim, concurrent-claim, retry,
      # duplicate, stale-lock takeover, and who may call the ledger.
      - name: Stripe webhook event ledger behaves correctly
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/stripe_webhook_event_ledger.sql
      # Chargeback register: insert, out-of-order stale events, field retention,
      # terminal-status close, and who may call it.
      - name: Payment dispute register behaves correctly
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/payment_disputes.sql
      # Refunded card top-ups: partial and full reversal, replay safety, and the
      # shortfall rule when the customer already spent the credit.
      - name: Wallet top-up refund reversal behaves correctly
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/topup_refund_reversal.sql
      - if: always()
        run: supabase stop --no-backup

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test, mobile, oauth-check, edge-functions, route-contract, secrets-check, translations, deno-lint, rls-static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
        env:
          VITE_E2E_LOCAL_AUTH: 'true'
          VITE_SUPABASE_URL: 'https://placeholder.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'placeholder'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-smoke-results
          path: test-results/
          retention-days: 7

  translations:
    name: Translation Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: node scripts/verify-translations.mjs

  deno-lint:
    name: Deno Lint + Test (Edge Functions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Lint edge functions
        run: deno lint supabase/functions/
      # Runs every suite in supabase/functions/tests/, not just the webhook one.
      # Each suite gets its own process because _handlers/shared.ts reads every
      # secret at module scope, so suites needing secrets present and absent
      # cannot share a module graph.
      - name: Test edge function handlers
        run: npm run test:edge

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          VITE_SUPABASE_URL: 'https://placeholder.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'placeholder'
      - run: npx @lhci/cli autorun --config=lighthouserc.cjs
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
