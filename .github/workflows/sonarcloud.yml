# SonarCloud analysis. Configure repository Actions variables:
#   SONAR_PROJECT_KEY and SONAR_ORGANIZATION
# and repository Actions secret:
#   SONAR_TOKEN
name: SonarCloud analysis

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Validate SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          missing=()
          [ -n "$SONAR_TOKEN" ] || missing+=("Actions secret SONAR_TOKEN")
          [ -n "$SONAR_PROJECT_KEY" ] || missing+=("Actions variable SONAR_PROJECT_KEY")
          [ -n "$SONAR_ORGANIZATION" ] || missing+=("Actions variable SONAR_ORGANIZATION")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '%s\n' "Missing required SonarCloud configuration:" "${missing[@]}"
            exit 1
          fi

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          projectBaseDir: .
