name: Deploy to Vercel

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Block high/critical dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run type-check

      - name: Strict lint
        run: npm run lint:strict

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build:optimized
        env:
          VITE_APP_ENV: production
          VITE_APP_URL: https://example.invalid
          VITE_SUPABASE_URL: https://ci-project.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-anon-key
          VITE_ENABLE_SYNTHETIC_DATA: 'false'
          VITE_ENABLE_SYNTHETIC_TRIPS: 'false'
          VITE_ALLOW_DIRECT_SUPABASE_FALLBACK: 'false'
          VITE_ALLOW_LOCAL_PERSISTENCE_FALLBACK: 'false'

  deploy:
    name: Deploy production to Vercel
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
