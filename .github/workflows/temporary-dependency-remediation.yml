name: Temporary dependency remediation and full verification

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

jobs:
  remediate-and-verify:
    if: ${{ github.event.pull_request.head.ref == 'security/booking-rpc-rate-limit-hardening' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply compatible dependency fixes only
        shell: bash
        run: |
          set +e
          npm audit fix --ignore-scripts --no-fund --no-progress
          FIX_EXIT=$?
          set -e
          echo "npm audit fix exit code: $FIX_EXIT"
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security: resolve compatible npm audit advisories"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "No compatible lockfile changes were required."
          fi

      - name: Clean install
        run: npm ci

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Function
        shell: bash
        run: |
          set -o pipefail
          deno check --no-lock supabase/functions/make-server-0b1f4071/index.ts 2>&1 | tee deno-check.log

      - name: Upload Deno check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deno-check-log
          path: deno-check.log
          if-no-files-found: warn

      - name: Format changed source files
        run: npx prettier --write src/contracts/communications.ts src/contracts/trips.ts src/contracts/wallet.ts src/services/dataIntegrity.ts src/services/directSupabase/trips.ts src/utils/api-validation.ts tests/unit/services/directSupabaseIntegrity.test.ts tests/unit/utils/idleScheduler.test.ts

      - name: Commit formatting
        shell: bash
        run: |
          if ! git diff --quiet -- src/contracts/communications.ts src/contracts/trips.ts src/contracts/wallet.ts src/services/dataIntegrity.ts src/services/directSupabase/trips.ts src/utils/api-validation.ts tests/unit/services/directSupabaseIntegrity.test.ts tests/unit/utils/idleScheduler.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/contracts/communications.ts src/contracts/trips.ts src/contracts/wallet.ts src/services/dataIntegrity.ts src/services/directSupabase/trips.ts src/utils/api-validation.ts tests/unit/services/directSupabaseIntegrity.test.ts tests/unit/utils/idleScheduler.test.ts
            git commit -m "style: format changed source files"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "Changed source files already satisfy Prettier."
          fi

      - name: High and critical dependency audit
        run: npm audit --audit-level=high
      - name: Full repository verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log

      - name: Upload repository verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-verification-log
          path: verify.log
          if-no-files-found: warn

      - name: Lighthouse and security verification
        shell: bash
        run: |
          set -o pipefail
          npm run test:lhci 2>&1 | tee lighthouse.log
          npm run test:security 2>&1 | tee security.log
          npm run verify:supabase-rollout 2>&1 | tee rollout.log

      - name: Upload extended verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extended-verification-logs
          path: |
            lighthouse.log
            security.log
            rollout.log
          if-no-files-found: warn
