name: Production Readiness Gate

on:
  workflow_dispatch:
  schedule:
    # Run every Monday at 07:00 UTC — weekly production health check
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: prod-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── 1. Coverage gate ─────────────────────────────────────────────────────────
  coverage:
    name: Coverage Thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run verify:coverage
      # The floors live in vitest.config.ts (coverage.thresholds) and are enforced by the
      # run above. This step repeats them so a weekly failure names the metric. Keep all
      # three places (vitest.config.ts, ci.yml, here) identical and ratchet them together.
      - name: Enforce thresholds (branches 20%, functions 25%, lines 30%, statements 28%)
        run: |
          node -e "
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')).total;
            const fail = [];
            if (s.branches.pct   < 20) fail.push('branches '   + s.branches.pct.toFixed(1)   + '% < 20%');
            if (s.functions.pct  < 25) fail.push('functions '  + s.functions.pct.toFixed(1)  + '% < 25%');
            if (s.lines.pct      < 30) fail.push('lines '      + s.lines.pct.toFixed(1)      + '% < 30%');
            if (s.statements.pct < 28) fail.push('statements ' + s.statements.pct.toFixed(1) + '% < 28%');
            if (fail.length) { console.error('Coverage gate FAILED:', fail.join(', ')); process.exit(1); }
            console.log('Coverage gate PASSED — branches=' + s.branches.pct.toFixed(1) + '%, functions=' + s.functions.pct.toFixed(1) + '%, lines=' + s.lines.pct.toFixed(1) + '%');
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── 2. Pre-flight checks ─────────────────────────────────────────────────────
  preflight:
    name: Production Pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - run: npm ci --legacy-peer-deps
      - name: Run production pre-flight checks
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EDGE_FUNCTION_NAME: ${{ vars.VITE_EDGE_FUNCTION_NAME || 'make-server-0b1f4071' }}
          VITE_APP_URL: ${{ vars.PRODUCTION_URL || 'https://www.wasel14.online' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_APP_INSIGHTS_CONNECTION_STRING: ${{ secrets.VITE_APP_INSIGHTS_CONNECTION_STRING }}
        run: node scripts/production-preflight.mjs
      - name: Validate edge bundles and migration manifests
        run: |
          npm run edge:sync:check
          npm run edge:graph
          npm run edge:types
          node scripts/reconcile-migrations.mjs
      - name: Linked migration history (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_DRIFT_ALLOW_SKIP: ${{ vars.DB_DRIFT_ALLOW_SKIP }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            if [ "$DB_DRIFT_ALLOW_SKIP" = "true" ]; then
              echo "::warning::Skipping linked migration check because DB_DRIFT_ALLOW_SKIP=true."
              exit 0
            fi
            echo "::warning::Skipping linked migration check: linked-project secrets are not set. Configure secrets to make this gate authoritative."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          node scripts/reconcile-migrations.mjs --linked
          supabase db push --linked --dry-run
          supabase db diff --linked --schema public > prod-drift.sql
          if [ -s prod-drift.sql ]; then
            echo "::error::Production schema differs from migrations."
            cat prod-drift.sql
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-readiness-drift
          path: prod-drift.sql
          if-no-files-found: ignore
          retention-days: 14

  # ── 3. Live integration probes ───────────────────────────────────────────────
  live-integrations:
    name: Live Integration Probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only probe live endpoints when credentials are available
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Probe live integrations
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EDGE_FUNCTIONS_BASE_URL: ${{ secrets.VITE_EDGE_FUNCTIONS_BASE_URL }}
          VITE_EDGE_FUNCTION_NAME: ${{ vars.VITE_EDGE_FUNCTION_NAME || 'make-server-0b1f4071' }}
          VITE_APP_URL: ${{ vars.PRODUCTION_URL || 'https://www.wasel14.online' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_APP_INSIGHTS_CONNECTION_STRING: ${{ secrets.VITE_APP_INSIGHTS_CONNECTION_STRING }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase credentials not set — skipping live integration probes."
            exit 0
          fi
          node scripts/verify-live-integrations.mjs

  # ── 4. Security audit ────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run secrets:check
      - run: npm run env:check
      - run: npm audit --audit-level=high

  # ── 5. Full build verification ───────────────────────────────────────────────
  build-verify:
    name: Full Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [coverage, preflight, security-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --legacy-peer-deps
      - run: npm run verify:ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 7
