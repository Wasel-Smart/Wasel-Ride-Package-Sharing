# Template Kubernetes Secret
# Replace placeholder values with base64-encoded actual secrets.
# Example: echo -n "my-secret" | base64
#
# Validation: kubectl create secret generic wasel-secrets --from-literal=DATABASE_URL='...' --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: wasel-secrets
  namespace: wasel
type: Opaque
data:
  # PostgreSQL connection string (e.g., postgresql://user:pass@host:5432/dbname)
  DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0BleGFtcGxlLmNvbTowNDIzL2Ri
  # JWT signing secret (min 32 characters for HS256)
  JWT_SECRET: eW91ci1qd3Qtc2VjcmV0LWtleS1leGFtcGxlLTEyMw==
  # Redis authentication password
  REDIS_PASSWORD: cmVkaXMtcGFzc3dvcmQ=
  # Stripe secret key for payment processing (sk_live_...)
  STRIPE_SECRET_KEY: c2tfbGl2ZV9leGFtcGxlX2tleQ==
  # Stripe webhook endpoint secret for signature verification
  STRIPE_WEBHOOK_SECRET: c3RyaXBlZF93ZWJob29rX3NlY3JldA==
  # Twilio Account SID for SMS/voice services
  TWILIO_ACCOUNT_SID: VEd2T2N4bEp3QVJaTFBWRXk=
  # Twilio Auth Token for API authentication
  TWILIO_AUTH_TOKEN: VEd2T2N4bEp3QVJaTFBWRXlfdG9rZW4=
  # Twilio phone number for sending messages (E.164 format)
  TWILIO_FROM_NUMBER: KzY0NTU0NTQ1NTQ1
  # SendGrid API key for email delivery
  SENDGRID_API_KEY: c2VjcmV0X2tleV9leGFtcGxl
  # SendGrid verified sender email address
  SENDGRID_FROM_EMAIL: dGVzdEB3YXNlbC5jb20=
