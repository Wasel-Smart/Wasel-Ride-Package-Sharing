apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: wasel
  labels:
    app: postgres
    component: backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: postgres
            component: backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: supabase/postgres:15.1.0.117
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/wasel_db_${TIMESTAMP}.sql.gz"
                  echo "Starting PostgreSQL backup at ${TIMESTAMP}"
                  pg_dump -U postgres -h postgres -d postgres --no-owner --no-privileges --clean --if-exists | gzip > "${BACKUP_FILE}"
                  echo "Backup completed: ${BACKUP_FILE}"
                  ls -lh /backups/
              envFrom:
                - secretRef:
                    name: wasel-secrets
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: wasel
  labels:
    app: postgres
    component: backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 50Gi