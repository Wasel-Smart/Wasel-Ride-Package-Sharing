# Template Kubernetes Secret
# DO NOT commit real secrets to version control.
# Create secrets using: kubectl create secret generic wasel-secrets --from-literal=DATABASE_URL='...' --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: wasel-secrets
  namespace: wasel
type: Opaque
stringData:
  # Replace the values below with your actual secrets
  DATABASE_URL: "REPLACE_WITH_DATABASE_URL"
  JWT_SECRET: "REPLACE_WITH_JWT_SECRET"
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"
  STRIPE_SECRET_KEY: "REPLACE_WITH_STRIPE_SECRET_KEY"
  STRIPE_WEBHOOK_SECRET: "REPLACE_WITH_STRIPE_WEBHOOK_SECRET"
  TWILIO_ACCOUNT_SID: "REPLACE_WITH_TWILIO_ACCOUNT_SID"
  TWILIO_AUTH_TOKEN: "REPLACE_WITH_TWILIO_AUTH_TOKEN"
  TWILIO_FROM_NUMBER: "REPLACE_WITH_TWILIO_FROM_NUMBER"
  SENDGRID_API_KEY: "REPLACE_WITH_SENDGRID_API_KEY"
  SENDGRID_FROM_EMAIL: "REPLACE_WITH_SENDGRID_FROM_EMAIL"
