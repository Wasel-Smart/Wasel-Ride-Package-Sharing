apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-service
  namespace: wasel-production
  labels:
    app: trust-service
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trust-service
  template:
    metadata:
      labels:
        app: trust-service
        component: worker
    spec:
      serviceAccountName: wasel-worker
      containers:
        - name: trust-service
          image: wasel.azurecr.io/trust-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wasel-secrets
                  key: database.url
            - name: PORT
              value: "3000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: trust-service-service
  namespace: wasel-production
spec:
  selector:
    app: trust-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trust-service-hpa
  namespace: wasel-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trust-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70