apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-matching-service
  namespace: wasel-production
  labels:
    app: ride-matching-service
    component: worker
spec:
  replicas: 2 # Start with 2 replicas, HPA will scale as needed
  selector:
    matchLabels:
      app: ride-matching-service
  template:
    metadata:
      labels:
        app: ride-matching-service
        component: worker
    spec:
      serviceAccountName: wasel-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        readOnlyRootFilesystem: true
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
        - name: ride-matching-service
          image: wasel.azurecr.io/ride-matching-service:latest # Replace with your registry and version
          ports:
            - containerPort: 3000 # Assuming the worker exposes a health check port
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wasel-secrets
                  key: database.url
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: wasel-config
                  key: redis.host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: wasel-config
                  key: redis.port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wasel-secrets
                  key: redis.password
            # Add any other environment variables required by the ride matching service
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          volumeMounts:
          - name: tmp
            mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health # Assuming a health endpoint
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready # Assuming a readiness endpoint
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ride-matching-service-service
  namespace: wasel-production
spec:
  selector:
    app: ride-matching-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ride-matching-service-hpa
  namespace: wasel-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ride-matching-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Consider adding custom metrics for queue depth if using Redis Streams
    # - type: Pods
    #   pods:
    #     metric:
    #       name: redis_stream_lag_seconds
    #     target:
    #       type: AverageValue
    #       averageValue: 30s # Scale if average lag exceeds 30 seconds