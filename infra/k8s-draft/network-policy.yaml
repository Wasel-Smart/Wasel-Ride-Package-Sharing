        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - wasel
      podSelector:
        matchLabels:
          app: api-server
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-egress
  namespace: wasel
spec:
  podSelector:
